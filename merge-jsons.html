<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Case Merger</title>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --text-color: #333;
            --bg-color: #f8f9fa;
            --error-color: #e63946;
            --success-color: #2a9d8f;
            --border-color: #ced4da;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--primary-color);
        }

        .intro {
            margin-bottom: 20px;
            text-align: center;
        }

        .form-control {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: Consolas, Monaco, 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .result {
            margin-top: 30px;
        }

        .alert {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .alert-error {
            background-color: rgba(230, 57, 70, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }

        .alert-success {
            background-color: rgba(42, 157, 143, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        #copyBtn {
            background-color: #6c757d;
        }

        #copyBtn:hover {
            background-color: #5a6268;
        }

        .paste-container {
            margin-bottom: 20px;
        }

        .paste-area {
            position: relative;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            background-color: #f8f9fa;
        }

        .paste-area h3 {
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .response-area {
            margin-top: 30px;
        }

        #notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background-color: var(--success-color);
            color: white;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: opacity 0.3s, transform 0.3s;
            opacity: 0;
            transform: translateY(-10px);
            z-index: 1000;
        }

        #notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        .remove-area {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #e63946;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 0;
        }

        .remove-area:hover {
            background-color: #c1121f;
        }

        #addAreaBtn {
            margin-bottom: 30px;
            background-color: #2a9d8f;
        }

        #addAreaBtn:hover {
            background-color: #1e7168;
        }
        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: var(--secondary);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Case Merger</h1>
        <p class="intro">Merge multiple JSON arrays of test cases into a single unified array.</p>


        <div id="pasteContainer" class="paste-container">
            <!-- Paste areas will be added here dynamically -->
        </div>
        <div class="action-buttons">
            <button id="addAreaBtn">+ Add Paste Area</button>
        </div>


        <div class="action-buttons">
            <button id="mergeBtn">Merge Test Cases</button>
            <button id="copyBtn" disabled>Copy Result</button>
            <button id="clearBtn">Clear All</button>
        </div>

        <div class="response-area">
            <div id="alertArea"></div>
            <div class="form-control result">
                <label for="resultOutput">Merged Result:</label>
                <textarea id="resultOutput" readonly placeholder="Merged JSON will appear here..."></textarea>
            </div>
        </div>
    </div>

    <div id="notification">Copied to clipboard!</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pasteContainer = document.getElementById('pasteContainer');
            const resultOutput = document.getElementById('resultOutput');
            const mergeBtn = document.getElementById('mergeBtn');
            const copyBtn = document.getElementById('copyBtn');
            const clearBtn = document.getElementById('clearBtn');
            const addAreaBtn = document.getElementById('addAreaBtn');
            const alertArea = document.getElementById('alertArea');
            const notification = document.getElementById('notification');
            
            let areaCount = 0;

            // Add first paste area by default
            addPasteArea();

            mergeBtn.addEventListener('click', mergeJsonArrays);
            copyBtn.addEventListener('click', copyToClipboard);
            clearBtn.addEventListener('click', clearAllInputs);
            addAreaBtn.addEventListener('click', addPasteArea);

            function addPasteArea() {
                areaCount++;
                
                const pasteArea = document.createElement('div');
                pasteArea.className = 'paste-area';
                pasteArea.setAttribute('data-area-id', areaCount);
                
                const heading = document.createElement('h3');
                heading.textContent = `Paste Area ${areaCount}`;
                
                const formControl = document.createElement('div');
                formControl.className = 'form-control';
                
                const textarea = document.createElement('textarea');
                textarea.id = `jsonInput${areaCount}`;
                textarea.placeholder = `Paste your JSON array here...`;
                
                // Only add remove button if it's not the first area
                if (areaCount > 1) {
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-area';
                    removeBtn.textContent = '×';
                    removeBtn.title = 'Remove this paste area';
                    removeBtn.addEventListener('click', function() {
                        pasteContainer.removeChild(pasteArea);
                    });
                    
                    pasteArea.appendChild(removeBtn);
                }
                
                formControl.appendChild(textarea);
                pasteArea.appendChild(heading);
                pasteArea.appendChild(formControl);
                
                pasteContainer.appendChild(pasteArea);
            }

            function mergeJsonArrays() {
                alertArea.innerHTML = '';

                let allTestCases = [];
                let hasError = false;

                // Function to parse and validate JSON input
                function parseInput(input, areaNumber) {
                    if (!input.trim()) return [];
                    
                    try {
                        const jsonData = JSON.parse(input);
                        if (!Array.isArray(jsonData)) {
                            throw new Error(`Input in Paste Area ${areaNumber} is not a valid JSON array.`);
                        }
                        return jsonData;
                    } catch (error) {
                        showAlert(`Error in Paste Area ${areaNumber}: ${error.message}`, 'error');
                        hasError = true;
                        return [];
                    }
                }

                // Get all textareas in the paste container
                const textareas = pasteContainer.querySelectorAll('textarea');
                
                if (textareas.length === 0) {
                    showAlert('No paste areas available. Please add at least one.', 'error');
                    return;
                }

                // Parse all inputs
                textareas.forEach(textarea => {
                    const areaId = textarea.id.replace('jsonInput', '');
                    const testCases = parseInput(textarea.value, areaId);
                    allTestCases = [...allTestCases, ...testCases];
                });

                if (hasError) return;

                if (allTestCases.length === 0) {
                    showAlert('No valid test cases found in any of the input areas.', 'error');
                    return;
                }

                // Format and display the result
                const formattedJson = JSON.stringify(allTestCases, null, 2);
                resultOutput.value = formattedJson;
                
                copyBtn.disabled = false;
                showAlert(`Successfully merged ${allTestCases.length} test cases.`, 'success');
            }

            function copyToClipboard() {
                resultOutput.select();
                document.execCommand('copy');
                
                // Show notification
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 2000);
            }

            function clearAllInputs() {
                const textareas = document.querySelectorAll('textarea');
                textareas.forEach(textarea => {
                    textarea.value = '';
                });
                
                resultOutput.value = '';
                alertArea.innerHTML = '';
                copyBtn.disabled = true;

                // Remove all paste areas except the first one
                const pasteAreas = document.querySelectorAll('.paste-area');
                
                pasteAreas.forEach((area, index) => {
                    if (index > 0) { // Keep the first area
                        pasteContainer.removeChild(area);
                    }
                });

                // Reset area count
                areaCount = 1;
            }

            function showAlert(message, type) {
                const alertElement = document.createElement('div');
                alertElement.className = `alert alert-${type}`;
                alertElement.textContent = message;
                alertArea.appendChild(alertElement);
            }
        });
    </script>
</body>
<footer>
    <p>Created by Hoang Phan: https://t.me/hoangpmwork</p>
</footer>
</html>
