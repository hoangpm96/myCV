<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Checklist - hoangphan.blog</title>
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2c3e50;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --light: #f8f9fa;
            --dark: #343a40;
            --border: #dee2e6;
            --shadow: rgba(0, 0, 0, 0.1);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
            padding: 15px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        h1 {
            color: var(--secondary);
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px var(--shadow);
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
        }
        
        .stat-title {
            font-size: 14px;
            color: var(--secondary);
            opacity: 0.8;
            margin-bottom: 8px;
        }
        
        .stat-count {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .categories-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .category {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px var(--shadow);
            overflow: hidden;
        }
        
        .category-header {
            background-color: var(--primary);
            color: white;
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        
        .category-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .count-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .category-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .category.open .category-content {
            max-height: 2000px;
        }
        
        .subcategory {
            border-bottom: 1px solid var(--border);
        }
        
        .subcategory:last-child {
            border-bottom: none;
        }
        
        .subcategory-header {
            padding: 12px 20px;
            background-color: rgba(52, 152, 219, 0.05);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        
        .subcategory-title {
            font-weight: 500;
            color: var(--secondary);
        }
        
        .subcategory-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .subcategory.open .subcategory-content {
            max-height: 1000px;
        }
        
        .check-item {
            padding: 10px 20px 10px 40px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        
        .check-item:last-child {
            border-bottom: none;
        }
        
        .check-item:before {
            content: "•";
            position: absolute;
            left: 25px;
            color: var(--primary);
        }
        
        .progress-bar {
            height: 8px;
            background-color: #eee;
            border-radius: 4px;
            margin-bottom: 5px;
            overflow: hidden;
        }
        
        .progress-value {
            height: 100%;
            background-color: var(--primary);
            border-radius: 4px;
        }
        
        .stats-small {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-box {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: var(--secondary);
            opacity: 0.7;
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .stats-small {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .category-header, .subcategory-header {
                padding: 10px 15px;
            }
            
            .check-item {
                padding: 10px 15px 10px 30px;
            }
            
            .check-item:before {
                left: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>View Checklist - hoangphan.blog</h1>
        </header>
        
        <div class="json-input-container" style="margin-bottom: 20px;">
            <textarea id="jsonInput" class="search-box" style="min-height: 100px; margin-bottom: 10px;" placeholder="Paste your checklist JSON data here..."></textarea>
            <button id="loadJsonBtn" style="padding: 8px 16px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer;">Load Checklist</button>
            <button id="clearJsonBtn" style="padding: 8px 16px; background: var(--danger); color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px;">Clear</button>
        </div>
        
        <input type="text" class="search-box" id="searchBox" placeholder="Search checks...">
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Checklists</div>
                <div class="stat-count" id="totalCount">0</div>
                <div class="progress-bar">
                    <div class="progress-value" style="width: 100%"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Categories</div>
                <div class="stat-count" id="catCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Subcategories</div>
                <div class="stat-count" id="subcatCount">0</div>
            </div>
        </div>
        
        <div class="stats-small" id="catStats">
            <!-- Category stats will be inserted here -->
        </div>
        
        <div class="categories-wrapper" id="categoriesContainer">
            <!-- Categories will be inserted here -->
        </div>
        
        <footer>
            <p>Created by Hoang Phan: https://t.me/hoangpmwork</p>
        </footer>
    </div>
    
    <script>
        // Checklist data
        let checklistData = [];

        // Calculate totals and render UI
        function init() {
            setupJsonInput();
            setupSearch();
        }
        
        function setupJsonInput() {
            const jsonInput = document.getElementById('jsonInput');
            const loadJsonBtn = document.getElementById('loadJsonBtn');
            const clearJsonBtn = document.getElementById('clearJsonBtn');
            
            loadJsonBtn.addEventListener('click', () => {
                try {
                    const jsonText = jsonInput.value.trim();
                    if (!jsonText) {
                        alert('Please paste JSON data first');
                        return;
                    }
                    
                    checklistData = JSON.parse(jsonText);
                    
                    // Validate data structure
                    if (!Array.isArray(checklistData)) {
                        throw new Error('JSON data must be an array');
                    }
                    
                    checklistData.forEach(cat => {
                        if (!cat.cat || !Array.isArray(cat.items)) {
                            throw new Error('Invalid category structure');
                        }
                        cat.items.forEach(subcat => {
                            if (!subcat.subc || !Array.isArray(subcat.checks)) {
                                throw new Error('Invalid subcategory structure');
                            }
                        });
                    });
                    
                    // Calculate stats and render UI
                    const stats = calculateStats();
                    
                    // Render stats
                    document.getElementById('totalCount').textContent = stats.totalChecks;
                    document.getElementById('catCount').textContent = stats.catCount;
                    document.getElementById('subcatCount').textContent = stats.subcatCount;
                    
                    // Render category stats
                    const catStatsContainer = document.getElementById('catStats');
                    catStatsContainer.innerHTML = '';
                    
                    for (let cat in stats.catCheckCounts) {
                        const catStat = document.createElement('div');
                        catStat.className = 'stat-card';
                        catStat.innerHTML = `
                            <div class="stat-title">${cat.substring(0, 20)}...</div>
                            <div class="stat-count">${stats.catCheckCounts[cat]}</div>
                        `;
                        catStatsContainer.appendChild(catStat);
                    }
                    
                    // Render checklist
                    renderChecklist();
                    
                    // Clear search
                    document.getElementById('searchBox').value = '';
                    
                } catch (error) {
                    alert('Error loading JSON data: ' + error.message);
                }
            });
            
            clearJsonBtn.addEventListener('click', () => {
                jsonInput.value = '';
                checklistData = [];
                document.getElementById('totalCount').textContent = '0';
                document.getElementById('catCount').textContent = '0';
                document.getElementById('subcatCount').textContent = '0';
                document.getElementById('catStats').innerHTML = '';
                document.getElementById('categoriesContainer').innerHTML = '';
                document.getElementById('searchBox').value = '';
            });
        }
        
        // Calculate statistics
        function calculateStats() {
            const stats = {
                totalChecks: 0,
                catCount: checklistData.length,
                subcatCount: 0,
                catCheckCounts: {}
            };
            
            checklistData.forEach(cat => {
                let catCheckCount = 0;
                stats.subcatCount += cat.items.length;
                
                cat.items.forEach(subcat => {
                    catCheckCount += subcat.checks.length;
                    stats.totalChecks += subcat.checks.length;
                });
                
                stats.catCheckCounts[cat.cat] = catCheckCount;
            });
            
            return stats;
        }
        
        // Render checklist
        function renderChecklist() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';
            
            checklistData.forEach((cat, catIndex) => {
                const catElement = document.createElement('div');
                catElement.className = 'category';
                catElement.id = `cat-${catIndex}`;
                
                // Calculate total checks in category
                let totalChecksInCat = 0;
                cat.items.forEach(subcat => {
                    totalChecksInCat += subcat.checks.length;
                });
                
                // Category header
                const catHeader = document.createElement('div');
                catHeader.className = 'category-header';
                catHeader.innerHTML = `
                    <div class="category-title">${cat.cat}</div>
                    <div class="count-badge">${totalChecksInCat}</div>
                `;
                catHeader.addEventListener('click', () => {
                    catElement.classList.toggle('open');
                });
                
                // Category content
                const catContent = document.createElement('div');
                catContent.className = 'category-content';
                
                // Subcategories
                cat.items.forEach((subcat, subcatIndex) => {
                    const subcatElement = document.createElement('div');
                    subcatElement.className = 'subcategory';
                    subcatElement.id = `subcat-${catIndex}-${subcatIndex}`;
                    
                    // Subcategory header
                    const subcatHeader = document.createElement('div');
                    subcatHeader.className = 'subcategory-header';
                    subcatHeader.innerHTML = `
                        <div class="subcategory-title">${subcat.subc}</div>
                        <div class="count-badge">${subcat.checks.length}</div>
                    `;
                    subcatHeader.addEventListener('click', () => {
                        subcatElement.classList.toggle('open');
                    });
                    
                    // Subcategory content
                    const subcatContent = document.createElement('div');
                    subcatContent.className = 'subcategory-content';
                    
                    // Checks
                    subcat.checks.forEach((check, checkIndex) => {
                        const checkElement = document.createElement('div');
                        checkElement.className = 'check-item';
                        checkElement.textContent = check;
                        checkElement.id = `check-${catIndex}-${subcatIndex}-${checkIndex}`;
                        
                        subcatContent.appendChild(checkElement);
                    });
                    
                    subcatElement.appendChild(subcatHeader);
                    subcatElement.appendChild(subcatContent);
                    catContent.appendChild(subcatElement);
                });
                
                catElement.appendChild(catHeader);
                catElement.appendChild(catContent);
                container.appendChild(catElement);
            });
        }
        
        // Setup search
        function setupSearch() {
            const searchBox = document.getElementById('searchBox');
            
            searchBox.addEventListener('input', () => {
                const searchTerm = searchBox.value.toLowerCase();
                
                if (searchTerm.length < 2) {
                    // Reset all to initial state
                    document.querySelectorAll('.category').forEach(cat => {
                        cat.style.display = 'block';
                        cat.classList.remove('open');
                    });
                    
                    document.querySelectorAll('.subcategory').forEach(subcat => {
                        subcat.style.display = 'block';
                        subcat.classList.remove('open');
                    });
                    
                    document.querySelectorAll('.check-item').forEach(check => {
                        check.style.display = 'block';
                        check.style.backgroundColor = '';
                    });
                    
                    return;
                }
                
                // Search and display results
                let hasResults = false;
                
                document.querySelectorAll('.check-item').forEach(check => {
                    const matches = check.textContent.toLowerCase().includes(searchTerm);
                    check.style.display = matches ? 'block' : 'none';
                    check.style.backgroundColor = matches ? 'rgba(52, 152, 219, 0.1)' : '';
                    
                    if (matches) {
                        hasResults = true;
                        
                        // Display category and parent subcategory
                        const subcatId = check.id.split('-').slice(0, 3).join('-');
                        const catId = check.id.split('-').slice(0, 2).join('-');
                        
                        document.getElementById(subcatId).style.display = 'block';
                        document.getElementById(subcatId).classList.add('open');
                        document.getElementById(catId).style.display = 'block';
                        document.getElementById(catId).classList.add('open');
                    }
                });
                
                // Hide categories with no results
                document.querySelectorAll('.subcategory').forEach(subcat => {
                    const hasVisibleChecks = Array.from(subcat.querySelectorAll('.check-item')).some(check => check.style.display !== 'none');
                    subcat.style.display = hasVisibleChecks ? 'block' : 'none';
                });
                
                document.querySelectorAll('.category').forEach(cat => {
                    const hasVisibleSubcats = Array.from(cat.querySelectorAll('.subcategory')).some(subcat => subcat.style.display !== 'none');
                    cat.style.display = hasVisibleSubcats ? 'block' : 'none';
                });
            });
        }
        
        // Initialize page when document is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
